services:
  announce:
    container_name: announce
    build:
      context: .
      args:
        # 每次构建前先运行 scripts/update_edge_tts_version.py 更新 .env
        EDGE_TTS_VERSION: ${EDGE_TTS_VERSION:-unset}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        DOCKERFILE_VERSION: "2"
      # 构建时间由 Dockerfile 写入 /opt/build_time；其余版本标识在此维护
    image: announce:latest

    restart: unless-stopped

    environment:
      - TZ=Asia/Shanghai
      - APP_VERSION=v12
      - COMPOSE_CONFIG_VERSION=2
      # 配置文件路径（默认 /app/config.json；也可留空使用默认路径）
      - HAM_BOT_CONFIG=/app/config.json

    volumes:
      - ./:/app  # 项目目录挂载到容器（含 config.json / config.example.json）
