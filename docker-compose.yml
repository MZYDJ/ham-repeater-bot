services:
  announce:
    container_name: announce
    build:
      context: .
      args:
        BUILD_TIME: "2026-08-30"
        # 每次构建前先运行 scripts/update_edge_tts_version.py 更新 .env
        EDGE_TTS_VERSION: ${EDGE_TTS_VERSION:-unset}
    image: announce:latest

    restart: unless-stopped

    environment:
      - TZ=Asia/Shanghai
      # 滔滔链路账号（必填）
      - TALK_USERNAME=YOUR_TALK_USERNAME
      - TALK_PASSWORD=YOUR_TALK_PASSWORD
      # 企业微信告警 Webhook（可选，留空禁用告警推送）
      - WECHAT_WEBHOOK_URL=

    volumes:
      - ./:/app  # 项目目录挂载到容器
