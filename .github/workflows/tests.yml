name: Regression tests

on:
  push:
    branches:
      - feat/net-control
  pull_request:
    branches:
      - feat/net-control

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Verify mandatory SOP documents
        run: |
          test -s AGENTS.md
          test -s MODIFICATION_CHECKLIST.md
          grep -q '标准代码修改 SOP' MODIFICATION_CHECKLIST.md
          test -s .github/pull_request_template.md
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install native audio libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libopus0 libmpg123-0
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip APScheduler==3.11.3 edge-tts==7.2.8 'dashscope>=1.18.0'
      - name: Compile Python modules
        run: python -m py_compile announce.py direct_announce.py net_control.py
      - name: Check startup script syntax
        run: bash -n start.sh
      - name: Test announcement and TTS
        run: python tests/test_announce.py
      - name: Test watchdog
        run: python tests/test_watchdog.py
      - name: Test integration suite
        run: timeout 110 python tests/run_tests.py
      - name: Test session state machine
        run: timeout 60 python tests/test_session.py
